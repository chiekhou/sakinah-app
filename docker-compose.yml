version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: sakinah_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sakinah_app_db
      POSTGRES_USER: sakinah_app_user
      POSTGRES_PASSWORD: sakinah_app_password_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - sakinah_app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakinah_app_user -d sakinah_app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de données MongoDB
  mongodb:
    image: mongo:7-jammy
    container_name: sakinah_app_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password_2024
      MONGO_INITDB_DATABASE: sakinah_app_chat
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - sakinah_app_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer (interface web pour PostgreSQL)
  adminer:
    image: adminer:latest
    container_name: sakinah_app_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    networks:
      - sakinah_app_network
    depends_on:
      - postgres

  # Mongo Express (interface web pour MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: sakinah_app_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin_password_2024
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin_password_2024@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - sakinah_app_network
    depends_on:
      - mongodb

networks:
  sakinah_app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local